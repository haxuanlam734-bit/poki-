<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anime Stick Clash V3</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
<canvas id="game" width="1280" height="720"></canvas>

<section id="lobby" class="screen">
  <div class="nav"><div class="logo">ANIME<span>STICK</span><b> CLASH</b></div><div class="wallet">✦ <strong id="lobbyCoins">1250</strong></div></div>
  <div class="lobbyGrid">
    <div class="showcase glass">
      <div class="season">SEASON 01 / SHADOW DISTRICT</div>
      <h1>AWAKEN<br><em>YOUR AURA.</em></h1>
      <p>Stickman anime fighter tốc độ cao. Combo, aerial juggle, parry, dash và những ultimate có hiệu ứng VFX.</p>
      <div class="buttons">
        <button id="playBtn" class="primary">⚔ VÀO ARENA</button>
        <button id="dailyBtn" class="secondary">🎁 DAILY REWARD</button>
      </div>
      <div class="featureRow"><span>⚡ 5 SKILLS</span><span>🔥 COMBOS</span><span>👹 ELITE BOSS</span><span>🌌 VFX</span></div>
    </div>
    <div class="roster glass">
      <h2>CHOOSE FIGHTER</h2>
      <div id="roster"></div>
      <div class="build">
        <div><label>POWER</label><div class="meter"><i id="power"></i></div></div>
        <div><label>DEFENSE</label><div class="meter"><i id="defense"></i></div></div>
        <div><label>SPEED</label><div class="meter"><i id="speed"></i></div></div>
      </div>
    </div>
  </div>
</section>

<section id="hud" class="hidden">
  <div class="hudTop">
    <div class="playerCard glass"><b id="fighterName"></b><div class="bar"><i id="hp"></i></div><div class="bar energy"><i id="energy"></i></div></div>
    <div class="wave glass">WAVE <strong id="wave">1</strong><small> A/D · W · SPACE · SHIFT · Q E R</small></div>
    <div class="wallet glass">✦ <strong id="coins">1250</strong></div>
  </div>
  <div id="combo"></div>
  <div id="skills"></div>
  <div id="mobile"></div>
</section>

<section id="result" class="screen hidden">
 <div class="result glass"><div class="season">ARENA RESULT</div><h2 id="resultTitle">DEFEATED</h2><p id="resultText"></p><button id="lobbyBtn" class="primary">⌂ SẢNH CHỜ</button><button id="reviveBtn" class="secondary">▶ REVIVE</button></div>
</section>
<div id="toast"></div>
</div>
<script type="module" src="src/main.js"></script>
</body></html>
