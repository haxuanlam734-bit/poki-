<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Stick Clash — ULTRA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="panel player"><b id="heroName">NOVA • AETHER</b><span id="level">LV 12</span>
      <div class="bar hp"><i id="hp"></i></div><div class="bar mana"><i id="mana"></i></div>
    </div>
    <div class="panel wave"><small>MISSION</small><strong id="wave">WAVE 1</strong><span id="objective">DEFEAT THE INCOMING</span></div>
    <div class="panel combo"><strong id="combo">0 HIT</strong><small>COMBO</small></div>
    <button id="pause">Ⅱ</button>
  </div>
  <div id="skills">
    <button data-skill="Q"><b>Q</b><span>STAR REND</span></button>
    <button data-skill="E"><b>E</b><span>PRISM RUSH</span></button>
    <button data-skill="R"><b>R</b><span>VOID NOVA</span></button>
    <button data-skill="F"><b>F</b><span>CELESTIAL</span></button>
    <button data-skill="T"><b>T</b><span>CHROMA BURST</span></button>
  </div>
  <div id="tips">WASD / ARROWS • SPACE DASH • Q E R F T SKILLS</div>
  <div id="menu">
    <div class="logo">ANIME <em>STICK</em> CLASH</div>
    <p>ULTRA VFX EDITION</p>
    <button id="play">PLAY</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
