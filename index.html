<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Zombie City Survival</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://game-sdk.poki.com/js/v2.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0f19; user-select: none; font-family: Arial, sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10;
        }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 5, 0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20;
        }
        #game-over h1 { font-size: 40px; color: #ef4444; margin-bottom: 10px; }
        button {
            background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none;
            padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">MÁU: <span id="hp" style="color: #22c55e;">100</span> | TIÊU DIỆT: <span id="score" style="color: #38bdf8;">0</span></div>

    <div id="game-over">
        <h1>BẠN ĐÃ GỤC NGÃ</h1>
        <button onclick="location.reload()">CHƠI LẠI</button>
    </div>

    <script>
        try {
            PokiSDK.init().then(() => { PokiSDK.gameLoadingFinished(); });
        } catch(e) {}

        // 1. Khởi tạo Scene 3D
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        // 2. Tạo Map đường phố 3D
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 3. Tạo Nhân vật 3D (Cứu hộ màu xanh dương)
        const playerGeometry = new THREE.BoxGeometry(1.5, 3, 1);
        const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x0ea5e9 });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        player.position.y = 1.5;
        scene.add(player);

        // 4. Tạo đàn Zombie 3D (Màu xanh lá đậm)
        let zombies = [];
        const zombieGeometry = new THREE.BoxGeometry(1.5, 3, 1);
        const zombieMaterial = new THREE.MeshStandardMaterial({ color: 0x15803d });

        for (let i = 0; i < 8; i++) {
            let zombie = new THREE.Mesh(zombieGeometry, zombieMaterial);
            zombie.position.set((Math.random() - 0.5) * 40, 1.5, (Math.random() - 0.5) * 40);
            scene.add(zombie);
            zombies.push(zombie);
        }

        // Bàn phím điều khiển
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        let score = 0;
        let hp = 100;

        // Vòng lặp game 3D
        function animate() {
            requestAnimationFrame(animate);

            // Di chuyển nhân vật bằng W, A, S, D
            if (keys['KeyW'] || keys['ArrowUp']) player.position.z -= 0.3;
            if (keys['KeyS'] || keys['ArrowDown']) player.position.z += 0.3;
            if (keys['KeyA'] || keys['ArrowLeft']) player.position.x -= 0.3;
            if (keys['KeyD'] || keys['ArrowRight']) player.position.x += 0.3;

            // Camera góc nhìn 3D đuổi theo sau nhân vật
            camera.position.set(player.position.x, player.position.y + 12, player.position.z + 14);
            camera.lookAt(player.position);

            // Zombie tự động đuổi theo nhân vật
            zombies.forEach(z => {
                z.position.x += (player.position.x - z.position.x) * 0.015;
                z.position.z += (player.position.z - z.position.z) * 0.015;
            });

            renderer.render(scene, camera);
        }
        animate();

        // Tự động co giãn khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
