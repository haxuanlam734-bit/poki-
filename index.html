<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#080b14">
<meta name="description" content="Astral Clash - 2D Stickman Anime Fighting Game">
<title>Astral Clash</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070d;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#gameWrap{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#070a12;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

.hidden{
    display:none!important;
}

/* ---------------- MENU ---------------- */

.screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 40%,rgba(67,110,255,.18),transparent 35%),
        linear-gradient(180deg,#050713,#0a0d18);
    z-index:20;
}

.logo{
    font-size:clamp(42px,8vw,92px);
    font-weight:1000;
    letter-spacing:8px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:
        0 0 8px #57a8ff,
        0 0 30px #307eff,
        0 0 70px #1550ff;
    animation:logoPulse 2s infinite alternate;
}

.subtitle{
    margin-top:8px;
    color:#93a9cc;
    letter-spacing:5px;
    font-size:13px;
    text-transform:uppercase;
}

@keyframes logoPulse{
    from{filter:brightness(.9)}
    to{filter:brightness(1.25)}
}

.menuButtons{
    margin-top:40px;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:min(330px,80vw);
}

.btn{
    border:1px solid rgba(115,180,255,.4);
    background:linear-gradient(180deg,#162644,#0d172a);
    color:#fff;
    padding:15px 24px;
    border-radius:10px;
    font-size:15px;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
    box-shadow:
        inset 0 1px rgba(255,255,255,.1),
        0 5px 25px rgba(0,0,0,.4);
    transition:.15s;
}

.btn:hover{
    transform:translateY(-2px);
    border-color:#62b4ff;
    box-shadow:0 0 25px rgba(65,155,255,.35);
}

.btn.primary{
    background:linear-gradient(180deg,#2677ff,#1743b9);
}

.smallText{
    position:absolute;
    bottom:18px;
    color:#5e6d88;
    font-size:11px;
    letter-spacing:1px;
}

/* ---------------- CHARACTER SELECT ---------------- */

#characterScreen{
    padding:25px;
}

.selectTitle{
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:25px;
}

.roster{
    width:min(1000px,95vw);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.characterCard{
    min-height:330px;
    border:1px solid #243552;
    background:linear-gradient(180deg,#111a2b,#090e18);
    border-radius:15px;
    padding:18px;
    cursor:pointer;
    transition:.2s;
    position:relative;
    overflow:hidden;
}

.characterCard:hover,
.characterCard.selected{
    border-color:#5aaaff;
    transform:translateY(-4px);
    box-shadow:0 0 35px rgba(55,130,255,.25);
}

.characterPreview{
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.cardAura{
    width:100px;
    height:100px;
    border-radius:50%;
    position:absolute;
    filter:blur(20px);
    opacity:.5;
}

.miniStick{
    position:relative;
    width:70px;
    height:135px;
    z-index:2;
}

.miniHead{
    position:absolute;
    width:35px;
    height:35px;
    border:5px solid white;
    border-radius:50%;
    left:18px;
    top:3px;
}

.miniBody{
    position:absolute;
    width:5px;
    height:62px;
    background:white;
    left:33px;
    top:38px;
}

.miniArm{
    position:absolute;
    width:5px;
    height:48px;
    background:white;
    top:45px;
    transform-origin:top center;
}

.miniArm.a{left:32px;transform:rotate(55deg)}
.miniArm.b{left:33px;transform:rotate(-55deg)}

.miniLeg{
    position:absolute;
    width:5px;
    height:55px;
    background:white;
    top:96px;
    transform-origin:top center;
}

.miniLeg.a{left:32px;transform:rotate(30deg)}
.miniLeg.b{left:33px;transform:rotate(-30deg)}

.cardName{
    font-size:22px;
    font-weight:900;
    margin-bottom:5px;
}

.cardRole{
    color:#7f91ae;
    font-size:12px;
    margin-bottom:12px;
}

.stat{
    margin-top:7px;
}

.statLabel{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:#8c9bb5;
}

.statBar{
    height:5px;
    background:#1b2638;
    border-radius:10px;
    overflow:hidden;
    margin-top:3px;
}

.statFill{
    height:100%;
    border-radius:10px;
}

/* ---------------- HUD ---------------- */

#hud{
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
}

.hpPanel{
    position:absolute;
    top:22px;
    width:36%;
}

#playerPanel{left:22px}
#enemyPanel{right:22px;text-align:right}

.name{
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:5px;
}

.hpBar,
.kiBar,
.transformBar{
    height:14px;
    background:#111827;
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,.4);
}

.hpFill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#ff294d,#ff7658);
    transition:width .12s;
}

.kiBar{
    margin-top:5px;
    height:7px;
}

.kiFill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#26aaff,#75efff);
}

.transformBar{
    margin-top:4px;
    height:5px;
}

.transformFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#c93cff,#ffdb5a);
}

#combo{
    position:absolute;
    left:50%;
    top:22%;
    transform:translateX(-50%);
    font-size:32px;
    font-weight:1000;
    color:#fff;
    text-shadow:0 0 15px #3ba5ff;
    opacity:0;
    transition:.15s;
}

#combo.show{
    opacity:1;
    transform:translateX(-50%) scale(1.1);
}

#skillBar{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    pointer-events:auto;
}

.skill{
    width:58px;
    height:58px;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(7,12,23,.86);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 5px 20px rgba(0,0,0,.45);
}

.skillKey{
    font-size:13px;
    font-weight:900;
    color:#fff;
}

.skillName{
    font-size:7px;
    color:#7f92ad;
    margin-top:4px;
    text-transform:uppercase;
}

.cooldown{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.65);
    border-radius:9px;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:900;
}

.skill.cooling .cooldown{
    display:flex;
}

#transformButton{
    position:absolute;
    right:20px;
    bottom:18px;
    width:95px;
    height:58px;
    border:1px solid #e34dff;
    background:linear-gradient(180deg,#4c1766,#210d35);
    color:white;
    border-radius:10px;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    pointer-events:auto;
    cursor:pointer;
}

#pauseButton{
    position:absolute;
    right:18px;
    top:90px;
    pointer-events:auto;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #4c5c77;
    background:#111827;
    color:white;
}

/* ---------------- MOBILE CONTROLS ---------------- */

#mobileControls{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:10;
    display:none;
}

.joy{
    position:absolute;
    bottom:30px;
    left:25px;
    width:130px;
    height:130px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.14);
    background:rgba(10,18,30,.3);
}

.joyKnob{
    position:absolute;
    width:52px;
    height:52px;
    border-radius:50%;
    background:rgba(90,170,255,.3);
    border:1px solid rgba(130,200,255,.5);
    left:39px;
    top:39px;
}

.touchButtons{
    position:absolute;
    right:20px;
    bottom:25px;
    width:200px;
    height:150px;
}

.touchBtn{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(10,17,28,.7);
    color:white;
    font-size:12px;
    font-weight:900;
    pointer-events:auto;
}

.t1{right:130px;top:35px}
.t2{right:70px;top:5px}
.t3{right:10px;top:35px}
.t4{right:70px;top:65px}

@media(max-width:800px){
    .roster{
        grid-template-columns:1fr;
        max-height:75vh;
        overflow-y:auto;
    }

    .characterCard{
        min-height:170px;
        display:grid;
        grid-template-columns:150px 1fr;
    }

    .characterPreview{
        height:130px;
    }

    #mobileControls{
        display:block;
    }

    #skillBar{
        bottom:170px;
        transform:translateX(-50%) scale(.8);
        transform-origin:center bottom;
    }

    #transformButton{
        bottom:170px;
        right:12px;
    }

    .hpPanel{
        width:42%;
        top:10px;
    }

    #playerPanel{left:10px}
    #enemyPanel{right:10px}

    .name{
        font-size:10px;
    }
}

/* ---------------- PAUSE ---------------- */

#pauseScreen{
    background:rgba(3,6,12,.8);
    backdrop-filter:blur(8px);
}

/* ---------------- LOADING ---------------- */

.loading{
    color:#7083a3;
    margin-top:25px;
    font-size:12px;
    letter-spacing:3px;
}
</style>
</head>

<!-- MOBILE -->
<div id="mobileControls">
    <div class="joy">
        <div class="joyKnob"></div>
    </div>

    <div class="touchButtons">
        <button class="touchBtn t1" data-key="1">1</button>

        <button class="touchBtn t3" data-key="3">3</button>

"use strict";

/* =========================================================
   ASTRAL CLASH
   Single-file HTML5 Canvas game
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 1280;
let H = 720;
let DPR = Math.min(window.devicePixelRatio || 1,2);

function resize(){
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();

/* =========================================================
   UTILITIES
   ========================================================= */

const TAU = Math.PI * 2;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);

function dist(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function chance(v){
    return Math.random()<v;
}

/* =========================================================
   INPUT
   ========================================================= */

const keys={};

window.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    keys[k]=true;

    if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){
        e.preventDefault();
    }

    if(k==="p") togglePause();

    if(game.running && !game.paused){
        if(k==="j") player.basicAttack();
        if(k>="1" && k<="4") player.useSkill(k);
        if(k==="q"||k==="e"||k==="r") player.useSkill(k);
        if(k==="f") player.useSkill("f");
        if(k==="g") player.transform();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

/* =========================================================
   PARTICLE SYSTEM
   ========================================================= */

const particles=[];

class Particle{
    constructor(x,y,opt={}){
        this.x=x;
        this.y=y;

        const angle=opt.angle ?? rand(0,TAU);
        const speed=opt.speed ?? rand(1,5);

        this.vx=Math.cos(angle)*speed;
        this.vy=Math.sin(angle)*speed;

        this.life=opt.life ?? rand(300,700);
        this.maxLife=this.life;

        this.size=opt.size ?? rand(2,6);
        this.color=opt.color ?? "#fff";

        this.gravity=opt.gravity ?? 0;

        this.glow=opt.glow ?? true;
        this.square=opt.square ?? false;
    }

    update(dt){
        this.x+=this.vx*dt/16;
        this.y+=this.vy*dt/16;
        this.vy+=this.gravity*dt/16;
        this.life-=dt;
    }

    draw(){
        const a=clamp(this.life/this.maxLife,0,1);

        ctx.save();
        ctx.globalAlpha=a;

        if(this.glow){
            ctx.shadowBlur=this.size*5;
            ctx.shadowColor=this.color;
        }

        ctx.fillStyle=this.color;

        if(this.square){
            ctx.fillRect(
                this.x-this.size/2,
                this.y-this.size/2,
                this.size,
                this.size
            );
        }else{
            ctx.beginPath();
            ctx.arc(this.x,this.y,this.size,0,TAU);
            ctx.fill();
        }

        ctx.restore();
    }
}

function burst(x,y,color,count=20,power=5){
    for(let i=0;i<count;i++){
        particles.push(new Particle(x,y,{
            color,
            speed:rand(.5,power),
            size:rand(1,5),
            life:rand(250,700)
        }));
    }
}

function sparks(x,y,color,count=15){
    for(let i=0;i<count;i++){
        particles.push(new Particle(x,y,{
            color,
            speed:rand(2,8),
            size:rand(1,3),
            life:rand(200,500),
            gravity:.15,
            square:true
        }));
    }
}

/* =========================================================
   FX
   ========================================================= */

let screenShake=0;
let flashAlpha=0;

function shake(amount){
    screenShake=Math.max(screenShake,amount);
}

function flash(amount=.25){
    flashAlpha=Math.max(flashAlpha,amount);
}

/* =========================================================
   PROJECTILES
   ========================================================= */

const projectiles=[];

class Projectile{

    constructor(owner,x,y,angle,speed,damage,color,type="orb"){
        this.owner=owner;
        this.x=x;
        this.y=y;
        this.angle=angle;
        this.speed=speed;
        this.damage=damage;
        this.color=color;
        this.type=type;
        this.life=1800;
        this.radius=type==="beam"?12:8;
    }

    update(dt){

        this.x+=Math.cos(this.angle)*this.speed*dt/16;
        this.y+=Math.sin(this.angle)*this.speed*dt/16;

        this.life-=dt;

        const target=this.owner===player?enemy:player;

        if(
            target.alive &&
            Math.hypot(target.x-this.x,target.y-this.y)<target.radius+this.radius+12
        ){
            target.takeDamage(this.damage,this.owner);
            burst(this.x,this.y,this.color,25,6);
            shake(7);
            this.life=0;
        }
    }

    draw(){

        ctx.save();

        ctx.translate(this.x,this.y);
        ctx.rotate(this.angle);

        ctx.shadowBlur=25;
        ctx.shadowColor=this.color;

        if(this.type==="beam"){
            ctx.fillStyle=this.color;
            ctx.globalAlpha=.25;
            ctx.fillRect(-35,-25,70,50);

            ctx.globalAlpha=1;
            ctx.fillRect(-30,-7,60,14);
        }else{
            ctx.fillStyle=this.color;
            ctx.beginPath();
            ctx.arc(0,0,this.radius,0,TAU);
            ctx.fill();

            ctx.globalAlpha=.35;
            ctx.beginPath();
            ctx.arc(-10,0,this.radius*2,0,TAU);
            ctx.fill();
        }

        ctx.restore();
    }
}

/* =========================================================
   STICKMAN
   ========================================================= */

class Stickman{

    constructor(x,y,data,isPlayer=false){

        this.x=x;
        this.y=y;

        this.vx=0;
        this.vy=0;

        this.groundY=y;

        this.data=data;
        this.isPlayer=isPlayer;

        this.radius=28;

        this.maxHp=data.hp;
        this.hp=data.hp;

        this.maxKi=data.ki;
        this.ki=data.ki;

        this.transform=0;
        this.transformed=false;

        this.alive=true;

        this.facing=isPlayer?1:-1;

        this.attackTimer=0;
        this.hitFlash=0;

        this.combo=0;
        this.comboTimer=0;

        this.cooldowns={};

        for(const key in data.skills){
            this.cooldowns[key]=0;
        }

        this.animTime=0;
        this.state="idle";

        this.invulnerable=0;
    }

    get color(){
        return this.transformed ?
            this.data.transform.color :
            this.data.color;
    }

    get accent(){
        return this.transformed ?
            this.data.transform.accent :
            this.data.accent;
    }

    update(dt){

        if(!this.alive)return;

        this.animTime+=dt;

        this.hitFlash=Math.max(0,this.hitFlash-dt);
        this.attackTimer=Math.max(0,this.attackTimer-dt);
        this.invulnerable=Math.max(0,this.invulnerable-dt);

        for(const k in this.cooldowns){
            this.cooldowns[k]=Math.max(0,this.cooldowns[k]-dt);
        }

        if(this.comboTimer>0){
            this.comboTimer-=dt;
        }else{
            this.combo=0;
        }

        this.vy+=.55*dt/16;

        this.x+=this.vx*dt/16;
        this.y+=this.vy*dt/16;

        const floor=H*.76;

        if(this.y>=floor){
            this.y=floor;
            this.vy=0;
        }

        this.x=clamp(this.x,70,W-70);

        this.vx*=Math.pow(.0005,dt/1000);

        if(this.transform>0 && !this.transformed){
            this.transform-=dt;
            if(this.transform<=0){
                this.transformed=false;
            }
        }

        if(this.isPlayer){
            this.playerControl(dt);
        }else{
            this.aiControl(dt);
        }

        this.ki=Math.min(this.maxKi,this.ki+.009*dt);

        if(this.hp<=0){
            this.die();
        }
    }

    playerControl(){

        if(!game.running || game.paused)return;

        let moving=false;

        if(keys["a"]||keys["arrowleft"]){
            this.vx-=.45;
            this.facing=-1;
            moving=true;
        }

        if(keys["d"]||keys["arrowright"]){
            this.vx+=.45;
            this.facing=1;
            moving=true;
        }

        this.vx=clamp(this.vx,-this.data.speed,this.data.speed);

        if(keys["w"]||keys[" "]||keys["arrowup"]){
            if(this.y>=H*.75){
                this.vy=-11;
                burst(this.x,this.y,this.color,8,3);
            }
        }

        if(keys["shift"] && Math.abs(this.vx)>1){
            this.dash();
            keys["shift"]=false;
        }

        this.state=moving?"run":"idle";
    }

    aiControl(dt){

        if(!player.alive)return;

        const d=player.x-this.x;

        this.facing=d>0?1:-1;

        if(Math.abs(d)>260){
            this.vx+=Math.sign(d)*.25;
            this.vx=clamp(this.vx,-this.data.speed*.75,this.data.speed*.75);
        }else{
            this.vx*=.85;

            if(Math.random()<.008){
                this.basicAttack();
            }

            if(Math.random()<.003){
                const keysSkill=Object.keys(this.data.skills);
                const k=keysSkill[Math.floor(Math.random()*keysSkill.length)];
                this.useSkill(k);
            }

            if(Math.random()<.0015 && this.transform<1){
                this.transform();
            }
        }

        if(Math.abs(d)<130 && Math.random()<.012){
            this.vx=-Math.sign(d)*5;
        }
    }

    dash(){

        if(this.ki<8)return;

        this.ki-=8;

        this.invulnerable=180;

        this.vx=this.facing*15;

        burst(this.x,this.y,this.color,15,5);
    }

    jump(){

        if(this.y>=H*.75){
            this.vy=-12;
        }
    }

    basicAttack(){

        if(this.attackTimer>0)return;

        this.attackTimer=250;
        this.state="attack";

        const reach=100;

        const target=this.isPlayer?enemy:player;

        if(
            target.alive &&
            Math.abs(target.x-this.x)<reach &&
            Math.abs(target.y-this.y)<100
        ){
            const dmg=32*this.data.power*(this.transformed?this.data.transform.multiplier:1);

            target.takeDamage(dmg,this);

            target.vx+=this.facing*4;

            sparks(target.x,target.y,this.color,12);

            this.registerCombo();
        }else{
            burst(
                this.x+this.facing*45,
                this.y-60,
                this.color,
                5,
                2
            );
        }
    }

    useSkill(key){

        const skill=this.data.skills[key];

        if(!skill)return;

        if(this.cooldowns[key]>0)return;

        if(this.ki<skill.cost)return;

        this.ki-=skill.cost;
        this.cooldowns[key]=skill.cooldown;

        const target=this.isPlayer?enemy:player;

        const power=this.transformed ?
            this.data.transform.multiplier :
            1;

        const damage=skill.damage*this.data.power*power;

        this.state="skill";

        skillEffect(this,skill,damage,target);
    }

    transform(){

        if(this.transformed)return;

        if(this.transform>0)return;

        if(this.ki<60)return;

        this.ki-=60;

        this.transformed=true;
        this.transform=999999;

        burst(this.x,this.y,this.data.transform.accent,100,10);
        shake(15);
        flash(.35);

        for(let i=0;i<40;i++){
            particles.push(new Particle(
                this.x+rand(-60,60),
                this.y+rand(-120,20),
                {
                    color:this.data.transform.accent,
                    speed:rand(1,5),
                    size:rand(2,7),
                    life:rand(600,1400),
                    angle:rand(-Math.PI,0)
                }
            ));
        }
    }

    registerCombo(){

        this.combo++;
        this.comboTimer=1000;

        if(this.isPlayer){
            comboEl.textContent=this.combo+" HIT";
            comboEl.classList.add("show");

            clearTimeout(this.comboHide);

            this.comboHide=setTimeout(()=>{
                comboEl.classList.remove("show");
            },850);
        }
    }

    takeDamage(amount,source){

        if(!this.alive)return;
        if(this.invulnerable>0)return;

        amount/=this.data.defense;

        this.hp-=amount;

        this.hitFlash=100;

        this.invulnerable=80;

        this.vx+=source.facing*2;

        sparks(this.x,this.y-50,"#ffffff",8);

        if(this.isPlayer){
            flash(.12);
        }
    }

    die(){

        if(!this.alive)return;

        this.alive=false;

        burst(
            this.x,
            this.y-60,
            this.color,
            100,
            12
        );

        shake(25);
        flash(.5);

        setTimeout(()=>{
            endBattle(this===enemy);
        },1000);
    }

    draw(){

        if(!this.alive)return;

        const x=this.x;
        const y=this.y;

        const speed=Math.abs(this.vx);

        const moving=Math.min(speed/this.data.speed,1);

        const walk=Math.sin(this.animTime*.018*(1+moving*2))*moving;

        const attack=this.state==="attack" ?
            Math.sin((this.attackTimer/250)*Math.PI) :
            0;

        const auraSize=this.transformed?
            90+Math.sin(this.animTime*.008)*15:
            0;

        ctx.save();

        /* Aura */

        if(this.transformed){

            const grd=ctx.createRadialGradient(
                x,y-60,5,
                x,y-60,auraSize
            );

            grd.addColorStop(0,this.accent);
            grd.addColorStop(.35,this.color+"88");
            grd.addColorStop(1,"transparent");

            ctx.fillStyle=grd;
            ctx.globalAlpha=.75;

            ctx.beginPath();
            ctx.arc(x,y-60,auraSize,0,TAU);
            ctx.fill();

            ctx.globalAlpha=.35;
            ctx.strokeStyle=this.accent;
            ctx.lineWidth=4;

            ctx.beginPath();

            for(let i=0;i<3;i++){

                const offset=i*2.1;

                ctx.moveTo(x,y-60);

                for(let t=0;t<Math.PI*2;t+=.2){

                    const r=
                        55+
                        Math.sin(t*3+this.animTime*.01+offset)*18;

                    const px=x+Math.cos(t)*r;
                    const py=y-60+Math.sin(t)*r;

                    if(t===0)ctx.moveTo(px,py);
                    else ctx.lineTo(px,py);
                }

                ctx.stroke();
            }
        }

        /* Shadow */

        ctx.globalAlpha=.3;
        ctx.fillStyle="#000";

        ctx.beginPath();
        ctx.ellipse(
            x,
            y+4,
            45+speed*3,
            9,
            0,0,TAU
        );
        ctx.fill();

        ctx.globalAlpha=1;

        const headY=y-115;
        const bodyTop=y-82;
        const bodyBottom=y-32;

        /* Head */

        ctx.strokeStyle=this.hitFlash>0?"#fff":this.color;
        ctx.fillStyle="#05070d";

        ctx.lineWidth=6;

        ctx.shadowBlur=this.transformed?20:8;
        ctx.shadowColor=this.color;

        ctx.beginPath();
        ctx.arc(x,headY,24,0,TAU);
        ctx.fill();
        ctx.stroke();

        /* Face */

        ctx.shadowBlur=0;
        ctx.strokeStyle=this.accent;
        ctx.lineWidth=3;

        const eyeOffset=this.facing*6;

        ctx.beginPath();
        ctx.moveTo(x+eyeOffset-5,headY-3);
        ctx.lineTo(x+eyeOffset+3,headY-3);
        ctx.stroke();

        /* Body */

        ctx.strokeStyle=this.hitFlash>0?"#fff":this.color;
        ctx.lineWidth=7;

        ctx.beginPath();
        ctx.moveTo(x,bodyTop);
        ctx.lineTo(x,bodyBottom);
        ctx.stroke();

        /* Arms */

        ctx.lineWidth=6;

        const armSwing=walk*.7;

        let leftArm=-Math.PI/2.7-armSwing;
        let rightArm=Math.PI/2.7+armSwing;

        if(attack){
            rightArm=-this.facing*.25;
            leftArm=this.facing*1.8;
        }

        drawLimb(
            x,
            bodyTop+5,
            x+Math.cos(leftArm)*43,
            bodyTop+5+Math.sin(leftArm)*43,
            this.color
        );

        drawLimb(
            x,
            bodyTop+5,
            x+Math.cos(rightArm)*43,
            bodyTop+5+Math.sin(rightArm)*43,
            this.color
        );

        /* Legs */

        const legA=.65+walk*.45;
        const legB=2.45-walk*.45;

        drawLimb(
            x,
            bodyBottom,
            x+Math.cos(legA)*52,
            bodyBottom+Math.sin(legA)*52,
            this.color
        );

        drawLimb(
            x,
            bodyBottom,
            x+Math.cos(legB)*52,
            bodyBottom+Math.sin(legB)*52,
            this.color
        );

        /* Energy core */

        if(this.transformed){

            ctx.fillStyle=this.accent;
            ctx.shadowBlur=20;
            ctx.shadowColor=this.accent;

            ctx.beginPath();
            ctx.arc(x,y-60,6+Math.sin(this.animTime*.02)*2,0,TAU);
            ctx.fill();
        }

        ctx.restore();
    }
}

function drawLimb(x1,y1,x2,y2,color){

    ctx.strokeStyle=color;

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();

    ctx.fillStyle=color;

    ctx.beginPath();
    ctx.arc(x2,y2,4,0,TAU);
    ctx.fill();
}

/* =========================================================
   SKILL EFFECTS
   ========================================================= */

function skillEffect(user,skill,damage,target){

    const dir=user.facing;

    switch(skill.type){

        case"projectile":{

            projectiles.push(
                new Projectile(
                    user,
                    user.x+dir*45,
                    user.y-65,
                    dir>0?0:Math.PI,
                    11,
                    damage,
                    skill.color,
                    "orb"
                )
            );

            burst(
                user.x+dir*35,
                user.y-65,
                skill.color,
                20,
                5
            );

            break;
        }

        case"beam":{

            const startX=user.x+dir*45;
            const endX=user.x+dir*420;

            createBeam(
                startX,
                user.y-70,
                endX,
                user.y-70,
                skill.color
            );

            if(
                Math.abs(target.x-user.x)<460 &&
                Math.abs(target.y-user.y)<120
            ){
                target.takeDamage(damage,user);
                user.registerCombo();
            }

            shake(10);
            flash(.2);

            break;
        }

        case"rush":{

            const oldX=user.x;

            user.invulnerable=400;

            user.x+=dir*180;

            burst(
                oldX,
                user.y-60,
                skill.color,
                30,
                7
            );

            if(
                Math.abs(target.x-user.x)<100 &&
                Math.abs(target.y-user.y)<100
            ){
                target.takeDamage(damage,user);
                target.vx+=dir*10;
                user.registerCombo();
            }

            shake(10);

            break;
        }

        case"gravity":{

            createGravity(
                target.x,
                target.y-60,
                skill.color
            );

            if(
                Math.abs(target.x-user.x)<350
            ){
                target.takeDamage(damage,user);
                target.vx*=.2;
                user.registerCombo();
            }

            shake(12);

            break;
        }

        case"barrage":{

            for(let i=0;i<8;i++){

                setTimeout(()=>{

                    if(!user.alive)return;

                    const spread=rand(-.3,.3);

                    projectiles.push(
                        new Projectile(
                            user,
                            user.x+user.facing*45,
                            user.y-65,
                            (user.facing>0?0:Math.PI)+spread,
                            9,
                            damage/3,
                            skill.color,
                            "orb"
                        )
                    );

                },i*80);
            }

            break;
        }

        case"teleport":{

            const old=user.x;

            user.x=target.x-user.facing*90;

            burst(old,user.y-60,skill.color,20,6);
            burst(user.x,user.y-60,skill.color,20,6);

            target.takeDamage(damage,user);

            user.registerCombo();

            break;
        }

        case"slash":{

            createSlash(
                user.x+dir*100,
                user.y-70,
                dir,
                skill.color
            );

            if(
                Math.abs(target.x-user.x)<220
            ){
                target.takeDamage(damage,user);
                user.registerCombo();
            }

            shake(8);

            break;
        }

        case"impact":{

            createImpact(
                target.x,
                target.y,
                skill.color
            );

            target.takeDamage(damage,user);
            target.vy=-7;

            user.registerCombo();

            shake(16);
            flash(.25);

            break;
        }

        case"domain":{

            createDomain(
                target.x,
                target.y,
                skill.color
            );

            if(Math.abs(target.x-user.x)<420){
                target.takeDamage(damage,user);
                user.registerCombo();
            }

            shake(18);

            break;
        }

        case"ultimate":{

            createUltimate(
                user,
                target,
                skill.color,
                damage
            );

            break;
        }
    }
}

/* =========================================================
   VISUAL EFFECTS
   ========================================================= */

const effects=[];

function createBeam(x1,y1,x2,y2,color){

    effects.push({
        type:"beam",
        x1,y1,x2,y2,
        color,
        life:500,
        maxLife:500
    });
}

function createGravity(x,y,color){

    effects.push({
        type:"gravity",
        x,y,
        color,
        life:1000,
        maxLife:1000
    });
}

function createSlash(x,y,dir,color){

    effects.push({
        type:"slash",
        x,y,
        dir,
        color,
        life:450,
        maxLife:450
    });
}

function createImpact(x,y,color){

    effects.push({
        type:"impact",
        x,y,
        color,
        life:650,
        maxLife:650
    });

    burst(x,y,color,60,10);
}

function createDomain(x,y,color){

    effects.push({
        type:"domain",
        x,y,
        color,
        life:1200,
        maxLife:1200
    });

    for(let i=0;i<30;i++){

        particles.push(
            new Particle(
                x+rand(-220,220),
                y+rand(-180,30),
                {
                    color,
                    size:rand(2,6),
                    speed:rand(.2,1),
                    life:rand(500,1300)
                }
            )
        );
    }
}

function createUltimate(user,target,color,damage){

    effects.push({
        type:"ultimate",
        user,
        target,
        color,
        life:1800,
        maxLife:1800,
        hit:false
    });

    user.invulnerable=1800;

    shake(25);
    flash(.45);

    burst(user.x,user.y-70,color,120,14);

    setTimeout(()=>{

        if(target.alive){

            target.takeDamage(damage,user);
            target.vx=user.facing*15;

            burst(
                target.x,
                target.y-60,
                color,
                150,
                16
            );

            shake(35);
            flash(.6);
        }

    },800);
}

function drawEffects(dt){

    for(let i=effects.length-1;i>=0;i--){

        const e=effects[i];

        e.life-=dt;

        const progress=1-e.life/e.maxLife;
        const alpha=clamp(e.life/e.maxLife,0,1);

        ctx.save();
        ctx.globalAlpha=alpha;

        if(e.type==="beam"){

            const grad=ctx.createLinearGradient(
                e.x1,e.y1,e.x2,e.y2
            );

            grad.addColorStop(0,"transparent");
            grad.addColorStop(.25,e.color);
            grad.addColorStop(.75,e.color);
            grad.addColorStop(1,"transparent");

            ctx.strokeStyle=grad;
            ctx.shadowBlur=35;
            ctx.shadowColor=e.color;
            ctx.lineWidth=50*(1-progress)+10;

            ctx.beginPath();
            ctx.moveTo(e.x1,e.y1);
            ctx.lineTo(e.x2,e.y2);
            ctx.stroke();

            ctx.strokeStyle="#fff";
            ctx.lineWidth=7;

            ctx.beginPath();
            ctx.moveTo(e.x1,e.y1);
            ctx.lineTo(e.x2,e.y2);
            ctx.stroke();
        }

        if(e.type==="gravity"){

            const r=80+progress*180;

            ctx.strokeStyle=e.color;
            ctx.shadowBlur=30;
            ctx.shadowColor=e.color;
            ctx.lineWidth=6;

            for(let i=0;i<4;i++){

                ctx.beginPath();

                ctx.arc(
                    e.x,
                    e.y,
                    r-i*20,
                    progress*TAU+i,
                    progress*TAU+i+Math.PI*1.5
                );

                ctx.stroke();
            }
        }

        if(e.type==="slash"){

            ctx.strokeStyle=e.color;
            ctx.shadowBlur=25;
            ctx.shadowColor=e.color;
            ctx.lineWidth=18;

            ctx.beginPath();

            const r=80;

            ctx.arc(
                e.x,
                e.y,
                r,
                e.dir>0?-1.2:-1.9,
                e.dir>0?.8:.1
            );

            ctx.stroke();
        }

        if(e.type==="impact"){

            const r=progress*180;

            ctx.strokeStyle=e.color;
            ctx.shadowBlur=30;
            ctx.shadowColor=e.color;
            ctx.lineWidth=12*(1-progress)+2;

            ctx.beginPath();
            ctx.arc(e.x,e.y,r,0,TAU);
            ctx.stroke();

            ctx.strokeStyle="#fff";
            ctx.lineWidth=3;

            for(let i=0;i<16;i++){

                const a=i*TAU/16;

                ctx.beginPath();
                ctx.moveTo(
                    e.x+Math.cos(a)*r,
                    e.y+Math.sin(a)*r
                );
                ctx.lineTo(
                    e.x+Math.cos(a)*(r+40),
                    e.y+Math.sin(a)*(r+40)
                );
                ctx.stroke();
            }
        }

        if(e.type==="domain"){

            const r=300*(1-Math.abs(progress-.5)*.5);

            ctx.strokeStyle=e.color;
            ctx.shadowBlur=40;
            ctx.shadowColor=e.color;
            ctx.lineWidth=4;

            ctx.beginPath();
            ctx.arc(e.x,e.y,r,0,TAU);
            ctx.stroke();

            ctx.globalAlpha*=.08;

            ctx.fillStyle=e.color;

            ctx.beginPath();
            ctx.arc(e.x,e.y,r,0,TAU);
            ctx.fill();
        }

        if(e.type==="ultimate"){

            const p=progress;

            ctx.fillStyle=e.color;
            ctx.globalAlpha=.08*(1-p);

            ctx.fillRect(0,0,W,H);

            const x=e.target.x;
            const y=e.target.y-70;

            const r=40+p*300;

            ctx.strokeStyle=e.color;
            ctx.shadowBlur=60;
            ctx.shadowColor=e.color;

            ctx.lineWidth=20*(1-p)+2;

            ctx.beginPath();
            ctx.arc(x,y,r,0,TAU);
            ctx.stroke();

            ctx.strokeStyle="#fff";
            ctx.lineWidth=4;

            ctx.beginPath();
            ctx.arc(x,y,r*.65,0,TAU);
            ctx.stroke();
        }

        ctx.restore();

        if(e.life<=0){
            effects.splice(i,1);
        }
    }
}

/* =========================================================
   WORLD
   ========================================================= */

let worldTime=0;

function drawBackground(){

    const gradient=ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#050714");
    gradient.addColorStop(.55,"#10152a");
    gradient.addColorStop(1,"#070b13");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    /* Moon */

    const moonX=W*.75;
    const moonY=H*.22;

    const moonGrad=ctx.createRadialGradient(
        moonX,moonY,10,
        moonX,moonY,150
    );

    moonGrad.addColorStop(0,"#bcd7ff");
    moonGrad.addColorStop(.35,"#738cc4");
    moonGrad.addColorStop(1,"transparent");

    ctx.fillStyle=moonGrad;
    ctx.globalAlpha=.35;

    ctx.beginPath();
    ctx.arc(moonX,moonY,150,0,TAU);
    ctx.fill();

    ctx.globalAlpha=1;

    /* Stars */

    for(let i=0;i<80;i++){

        const x=(i*173)%W;
        const y=(i*71)%(H*.65);

        const a=.2+.15*Math.sin(worldTime*.001+i);

        ctx.globalAlpha=a;
        ctx.fillStyle="#b8d5ff";

        ctx.fillRect(x,y,1.5,1.5);
    }

    ctx.globalAlpha=1;

    /* Mountains */

    ctx.fillStyle="#080d19";

    ctx.beginPath();
    ctx.moveTo(0,H*.72);

    for(let x=0;x<=W;x+=80){

        const y=
            H*.56+
            Math.sin(x*.008)*50+
            Math.sin(x*.018)*25;

        ctx.lineTo(x,y);
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();

    /* Arena */

    const floor=H*.76;

    const floorGrad=ctx.createLinearGradient(
        0,floor,
        0,H
    );

    floorGrad.addColorStop(0,"#1b2b43");
    floorGrad.addColorStop(1,"#080d16");

    ctx.fillStyle=floorGrad;
    ctx.fillRect(0,floor,W,H-floor);

    ctx.strokeStyle="#3a5d7c";
    ctx.globalAlpha=.7;
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,floor);
    ctx.lineTo(W,floor);
    ctx.stroke();

    ctx.globalAlpha=.2;

    for(let x=0;x<W;x+=80){

        ctx.beginPath();
        ctx.moveTo(x,floor);
        ctx.lineTo(x+100,H);
        ctx.stroke();
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   GAME
   ========================================================= */

const game={
    running:false,
    paused:false,
    last:0,
    selected:"nova",
    enemy:"zen"
};

let player=null;
let enemy=null;

function startBattle(){

    hideAllScreens();

    document.getElementById("hud").classList.remove("hidden");

    game.running=true;
    game.paused=false;

    const pData=CHARACTERS[game.selected];

    const enemyKeys=Object.keys(CHARACTERS)
        .filter(k=>k!==game.selected);

    game.enemy=
        enemyKeys[Math.floor(Math.random()*enemyKeys.length)];

    const eData=CHARACTERS[game.enemy];

    player=new Stickman(
        W*.25,
        H*.76,
        pData,
        true
    );

    enemy=new Stickman(
        W*.75,
        H*.76,
        eData,
        false
    );

    player.facing=1;
    enemy.facing=-1;

    buildSkillBar();

    updateHUD();
}

function endBattle(playerWon){

    game.running=false;

    setTimeout(()=>{

        const screen=document.createElement("section");

        screen.className="screen";
        screen.id="resultScreen";

        screen.innerHTML=`
            <div class="logo" style="font-size:50px">
                ${playerWon?"VICTORY":"DEFEATED"}
            </div>

            <div class="subtitle">
                ${playerWon?"THE ARENA BELONGS TO YOU":"TRAIN AND RETURN"}
            </div>

            <div class="menuButtons">
                <button class="btn primary" id="againBtn">
                    REMATCH
                </button>

                <button class="btn" id="menuBtn">
                    MAIN MENU
                </button>
            </div>
        `;

        document.getElementById("gameWrap")
            .appendChild(screen);

        document.getElementById("againBtn")
            .onclick=()=>{
                screen.remove();
                startBattle();
            };

        document.getElementById("menuBtn")
            .onclick=()=>{
                screen.remove();
                showMenu();
            };

    },100);
}

function gameLoop(timestamp){

    const dt=Math.min(32,timestamp-(game.last||timestamp));

    game.last=timestamp;

    if(game.running && !game.paused){

        update(dt);
        draw(dt);
    }else if(!game.running){

        drawMenuBackground();
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

function update(dt){

    worldTime+=dt;

    player.update(dt);
    enemy.update(dt);

    for(let i=projectiles.length-1;i>=0;i--){

        projectiles[i].update(dt);

        if(projectiles[i].life<=0){
            projectiles.splice(i,1);
        }
    }

    for(let i=particles.length-1;i>=0;i--){

        particles[i].update(dt);

        if(particles[i].life<=0){
            particles.splice(i,1);
        }
    }

    screenShake=Math.max(0,screenShake-dt*.025);
    flashAlpha=Math.max(0,flashAlpha-dt*.0015);

    updateHUD();
}

function draw(dt){

    ctx.save();

    if(screenShake>0){

        ctx.translate(
            rand(-screenShake,screenShake),
            rand(-screenShake,screenShake)
        );
    }

    drawBackground();

    player.draw();
    enemy.draw();

    for(const p of projectiles){
        p.draw();
    }

    drawEffects(dt);

    for(const p of particles){
        p.draw();
    }

    ctx.restore();

    if(flashAlpha>0){

        ctx.fillStyle=`rgba(255,255,255,${flashAlpha})`;
        ctx.fillRect(0,0,W,H);
    }
}

function drawMenuBackground(){

    ctx.fillStyle="#05070d";
    ctx.fillRect(0,0,W,H);

    worldTime+=16;

    const g=ctx.createRadialGradient(
        W*.5,H*.45,10,
        W*.5,H*.45,W*.7
    );

    g.addColorStop(0,"#101c3c");
    g.addColorStop(1,"#05070d");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    for(let i=0;i<50;i++){

        const x=(i*233)%W;
        const y=(i*97)%H;

        ctx.fillStyle="#6da9ff";
        ctx.globalAlpha=.2;

        ctx.fillRect(x,y,2,2);
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   HUD
   ========================================================= */

const comboEl=document.getElementById("combo");

function updateHUD(){

    if(!player||!enemy)return;

    document.getElementById("playerName")
        .textContent=player.transformed?
        player.data.transform.name:
        player.data.name;

    document.getElementById("enemyName")
        .textContent=enemy.transformed?
        enemy.data.transform.name:
        enemy.data.name;

    document.getElementById("playerHP")
        .style.width=
        `${clamp(player.hp/player.maxHp,0,1)*100}%`;

    document.getElementById("enemyHP")
        .style.width=
        `${clamp(enemy.hp/enemy.maxHp,0,1)*100}%`;

    document.getElementById("playerKi")
        .style.width=
        `${clamp(player.ki/player.maxKi,0,1)*100}%`;

    document.getElementById("playerTransform")
        .style.width=
        player.transformed?"100%":
        `${clamp(player.ki/60,0,1)*100}%`;
}

/* =========================================================
   SKILL BAR
   ========================================================= */

function buildSkillBar(){

    const bar=document.getElementById("skillBar");

    bar.innerHTML="";

    const keysSkill=[
        "1","2","3","4",
        "q","e","r","f"
    ];

    for(const key of keysSkill){

        const skill=player.data.skills[key];

        const el=document.createElement("div");

        el.className="skill";
        el.dataset.key=key;

        el.innerHTML=`
            <div class="skillKey">
                ${key.toUpperCase()}
            </div>

            <div class="skillName">
                ${skill.name}
            </div>

            <div class="cooldown">
                <span>0</span>
            </div>
        `;

        bar.appendChild(el);
    }
}

function updateSkillBar(){

    if(!player)return;

    document
        .querySelectorAll(".skill")
        .forEach(el=>{

            const k=el.dataset.key;
            const cd=player.cooldowns[k]||0;

            if(cd>0){

                el.classList.add("cooling");

                const span=el.querySelector(".cooldown span");

                span.textContent=
                    Math.ceil(cd/1000);
            }else{
                el.classList.remove("cooling");
            }
        });
}

/* =========================================================
   MOBILE BUTTONS
   ========================================================= */

document.querySelectorAll(".touchBtn")
.forEach(btn=>{

    const key=btn.dataset.key;

    const press=()=>{
        if(player)player.useSkill(key);
    };

    btn.addEventListener("pointerdown",e=>{
        e.preventDefault();
        press();
    });
});

const joy=document.querySelector(".joy");
const knob=document.querySelector(".joyKnob");

let joyActive=false;

joy.addEventListener("pointerdown",e=>{
    joyActive=true;
    joy.setPointerCapture(e.pointerId);
});

joy.addEventListener("pointermove",e=>{

    if(!joyActive||!player)return;

    const r=joy.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=e.clientX-cx;
    let dy=e.clientY-cy;

    const max=45;

    const len=Math.hypot(dx,dy);

    if(len>max){
        dx=dx/len*max;
        dy=dy/len*max;
    }

    knob.style.transform=
        `translate(${dx}px,${dy}px)`;

    if(dx>15){
        keys["d"]=true;
        keys["a"]=false;
    }else if(dx<-15){
        keys["a"]=true;
        keys["d"]=false;
    }else{
        keys["a"]=false;
        keys["d"]=false;
    }
});

joy.addEventListener("pointerup",()=>{
    joyActive=false;
    keys["a"]=false;
    keys["d"]=false;
    knob.style.transform="";
});

/* =========================================================
   MENUS
   ========================================================= */

function hideAllScreens(){

    document
        .querySelectorAll(".screen")
        .forEach(x=>x.classList.add("hidden"));
}

function showMenu(){

    game.running=false;

    document.getElementById("hud")
        .classList.add("hidden");

    hideAllScreens();

    document.getElementById("menuScreen")
        .classList.remove("hidden");
}

document.getElementById("playBtn")
.onclick=()=>{
    startBattle();
};

document.getElementById("characterBtn")
.onclick=()=>{
    showCharacterScreen();
};

document.getElementById("controlsBtn")
.onclick=()=>{
    hideAllScreens();
    document.getElementById("controlsScreen")
        .classList.remove("hidden");
};

document.getElementById("backControls")
.onclick=showMenu;

document.getElementById("backFromCharacter")
.onclick=showMenu;

document.getElementById("fightSelected")
.onclick=startBattle;

document.getElementById("pauseButton")
.onclick=togglePause;

document.getElementById("resumeBtn")
.onclick=togglePause;

document.getElementById("quitBtn")
.onclick=showMenu;

document.getElementById("transformButton")
.onclick=()=>{
    if(player)player.transform();
};

function togglePause(){

    if(!game.running)return;

    game.paused=!game.paused;

    if(game.paused){

        document.getElementById("pauseScreen")
            .classList.remove("hidden");

    }else{

        document.getElementById("pauseScreen")
            .classList.add("hidden");
    }
}

   CHARACTER SELECT
   ========================================================= */

    document.getElementById("characterScreen")

    const roster=document.getElementById("roster");

    roster.innerHTML="";

    for(const id in CHARACTERS){

        const c=CHARACTERS[id];

        const card=document.createElement("div");

        card.className=
            "characterCard"+
            (game.selected===id?" selected":"");

        card.innerHTML=`

                <div
                    class="cardAura"
                    style="
                        background:${c.color};
                    "
                ></div>

                <div class="miniStick">

                    <div class="miniHead"></div>

                    <div class="miniBody"></div>

                    <div class="miniArm a"></div>
                    <div class="miniArm b"></div>

                    <div class="miniLeg a"></div>
                    <div class="miniLeg b"></div>

                </div>

            </div>

            <div>

                <div
                    class="cardName"
                    style="color:${c.color}"
                >
                    ${c.name}
                </div>

                <div class="cardRole">
                    ${c.role}
                </div>

                <div class="stat">

                    <div class="statLabel">
                        <span>HP</span>
                        <span>${c.hp}</span>
                    </div>

                    <div class="statBar">
                        <div
                            class="statFill"
                            style="
                                width:${c.hp/15}%;
                                background:${c.color};
                            "
                        ></div>
                    </div>

                </div>

                <div class="stat">

                    <div class="statLabel">
                        <span>SPEED</span>
                    </div>

                    <div class="statBar">
                        <div
                            class="statFill"
                            style="
                                width:${c.speed/7*100}%;
                                background:${c.color};
                            "
                        ></div>
                    </div>

                </div>

                <div class="stat">

                    <div class="statLabel">
                        <span>POWER</span>
                    </div>

                    <div class="statBar">
                        <div
                            class="statFill"
                            style="
                                width:${c.power/1.5*100}%;
                                background:${c.color};
                            "
                        ></div>
                    </div>

                </div>

                <div
                    style="
                        margin-top:15px;
                        color:#788ba9;
                        font-size:10px;
                    "
                >
                    TRANSFORMATION:
                    <span style="color:${c.accent}">
                        ${c.transform.name}
                    </span>

        card.onclick=()=>{
