<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Zombie City Survival</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://game-sdk.poki.com/js/v2.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; user-select: none; font-family: Arial, sans-serif; cursor: crosshair; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 10px; height: 10px; border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }
        #instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #9ca3af;
            font-size: 16px; text-shadow: 1px 1px 2px #000; z-index: 10; pointer-events: none; text-align: center;
        }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 5, 0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20;
        }
        #game-over h1 { font-size: 40px; color: #ef4444; margin-bottom: 10px; }
        button {
            background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none;
            padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">MÁU: <span id="hp" style="color: #22c55e;">100</span> | TIÊU DIỆT: <span id="score" style="color: #38bdf8;">0</span></div>
    <div id="crosshair"></div>
    <div id="instructions">Click màn hình để khóa chuột (Roblox Mode) | W,A,S,D di chuyển | Click trái để bắn</div>

    <div id="game-over">
        <h1>BẠN ĐÃ GỤC NGÃ</h1>
        <button onclick="location.reload()">CHƠI LẠI</button>
    </div>

    <script>
        try {
            PokiSDK.init().then(() => { PokiSDK.gameLoadingFinished(); });
        } catch(e) {}

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng môi trường và chiều sâu
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, 50, 20);
        scene.add(dirLight);

        // Lưới không gian rộng (Không dùng map ảnh phẳng)
        const gridHelper = new THREE.GridHelper(400, 80, 0x1f2937, 0x111827);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // 1. Tạo Nhân vật & Súng chân thực (Chi tiết nòng, thân, báng súng)
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Thân nhân vật
        const bodyMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 2.4, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 })
        );
        bodyMesh.position.y = 1.2;
        playerGroup.add(bodyMesh);

        // Cấu tạo Súng chân thực (Group riêng cho súng)
        const gunGroup = new THREE.Group();
        gunGroup.position.set(0.5, 1.2, 0.4);

        // Thân súng chính
        const gunBody = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 0.25, 1.2),
            new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.8, roughness: 0.2 })
        );
        gunGroup.add(gunBody);

        // Nòng súng dài phía trước
        const gunBarrel = new THREE.Mesh(
            new THREE.CylinderGeometry(0.06, 0.06, 0.8, 8),
            new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.9 })
        );
        gunBarrel.rotation.x = Math.PI / 2;
        gunBarrel.position.set(0, 0.05, -0.8);
        gunGroup.add(gunBarrel);

        // Ống ngắm trên súng
        const gunScope = new THREE.Mesh(
            new THREE.BoxGeometry(0.12, 0.15, 0.4),
            new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.5 })
        );
        gunScope.position.set(0, 0.2, -0.1);
        gunGroup.add(gunScope);

        playerGroup.add(gunGroup);

        // 2. Tạo đàn Zombie 3D chi tiết
        let zombies = [];
        const zombieGeo = new THREE.BoxGeometry(1.2, 2.4, 0.8);
        const zombieMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.7 });

        for (let i = 0; i < 15; i++) {
            let zombie = new THREE.Mesh(zombieGeo, zombieMat);
            zombie.position.set((Math.random() - 0.5) * 100, 1.2, (Math.random() - 0.5) * 100);
            scene.add(zombie);
            zombies.push(zombie);
        }

        let bullets = [];
        let score = 0;
        let hp = 100;
        let keys = {};

        // Biến điều khiển camera mượt như Roblox
        let yaw = 0;   
        let pitch = 0; 

        window.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                let sensitivity = 0.0025;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;
                pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
            }
        });

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Bắn đạn từ nòng súng theo hướng tâm nhìn
        window.addEventListener('mousedown', () => {
            if (document.pointerLockElement !== document.body) return;
            
            let bullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xfacc15 })
            );
            
            // Đạn bay ra từ vị trí nhân vật
            bullet.position.copy(playerGroup.position);
            bullet.position.y = 1.3;
            
            bullet.userData = { 
                vx: -Math.sin(yaw) * 1.8, 
                vz: -Math.cos(yaw) * 1.8 
            };
            scene.add(bullet);
            bullets.push(bullet);
        });

        function animate() {
            requestAnimationFrame(animate);

            // Di chuyển W, A, S, D mượt theo hướng nhìn
            let speed = 0.45;
            let moveX = 0;
            let moveZ = 0;

            if (keys['KeyW'] || keys['ArrowUp']) {
                moveX -= Math.sin(yaw) * speed;
                moveZ -= Math.cos(yaw) * speed;
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                moveX += Math.sin(yaw) * speed;
                moveZ += Math.cos(yaw) * speed;
            }
            if (keys['KeyA'] || keys['ArrowLeft']) {
                moveX -= Math.cos(yaw) * speed;
                moveZ += Math.sin(yaw) * speed;
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                moveX += Math.cos(yaw) * speed;
                moveZ -= Math.sin(yaw) * speed;
            }

            playerGroup.position.x += moveX;
            playerGroup.position.z += moveZ;
            playerGroup.rotation.y = yaw;

            // Góc nhìn Camera phía sau lưng kết hợp xoay chuột 360 độ
            let camX = playerGroup.position.x + Math.sin(yaw) * 7 * Math.cos(pitch);
            let camY = playerGroup.position.y + 2.2 + Math.sin(pitch) * 7;
            let camZ = playerGroup.position.z + Math.cos(yaw) * 7 * Math.cos(pitch);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

            // Xử lý đạn bay và va chạm zombie
            bullets.forEach((b, index) => {
                b.position.x += b.userData.vx;
                b.position.z += b.userData.vz;

                zombies.forEach((z, zIndex) => {
                    if (b.position.distanceTo(z.position) < 1.8) {
                        scene.remove(z);
                        zombies.splice(zIndex, 1);
                        scene.remove(b);
                        bullets.splice(index, 1);
                        score++;
                        document.getElementById("score").innerText = score;
                    }
                });
            });

            // Zombie rượt đuổi người chơi
            zombies.forEach(z => {
                z.position.x += (playerGroup.position.x - z.position.x) * 0.016;
                z.position.z += (playerGroup.position.z - z.position.z) * 0.016;

                if (playerGroup.position.distanceTo(z.position) < 1.5) {
                    hp -= 0.6;
                    document.getElementById("hp").innerText = Math.max(0, Math.floor(hp));
                    if (hp <= 0) {
                        document.getElementById("game-over").style.display = "flex";
                        document.exitPointerLock();
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
