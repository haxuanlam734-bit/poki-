<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night City Racing - Game Lobby</title>
    <style>
        /* Reset cài đặt mặc định */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050510;
        }
        /* Canvas hiển thị đồ họa 3D */
        #game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Giao diện UI đè lên đồ họa 3D */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            pointer-events: none; /* Giúp chuột vẫn tương tác được với 3D ở dưới */
        }
        .ui-element {
            pointer-events: auto; /* Bật lại tương tác cho các nút bấm */
        }
        /* Tiêu đề Game phong cách Neon */
        .game-title {
            color: #fff;
            font-size: 3rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #00ffff;
            animation: pulse 2s infinite alternate;
        }
        .game-subtitle {
            font-size: 1.2rem;
            color: #00ffff;
            letter-spacing: 6px;
            text-shadow: 0 0 5px #00ffff;
            margin-top: -5px;
        }
        /* Thanh Menu điều hướng ở cạnh dưới */
        .menu-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }
        .menu-btn {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(0, 0, 0, 0.6));
            border: 2px solid #ff007f;
            color: #ffffff;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            font-style: italic;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
            transition: all 0.3s ease;
        }
        .menu-btn:hover {
            background: #ff007f;
            box-shadow: 0 0 20px #ff007f, 0 0 10px #00ffff;
            transform: scale(1.05) translateY(-3px);
            border-color: #00ffff;
        }
        /* Hiệu ứng nhấp nháy chữ */
        @keyframes pulse {
            0% { opacity: 0.9; }
            100% { opacity: 1; }
        }
    </style>
    <!-- Nhúng thư viện đồ họa Three.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Nơi render đồ họa 3D -->
    <canvas id="game-canvas"></canvas>

    <!-- Nơi chứa giao diện 2D (UI) -->
    <div class="ui-container">
        <!-- Khu vực phía trên: Logo và Tiêu đề -->
        <div class="ui-element">
            <h1 class="game-title">Night City</h1>
            <div class="game-subtitle">RACING</div>
        </div>

        <!-- Khu vực phía dưới: Các nút chức năng chính -->
        <div class="menu-bar ui-element">
            <button class="menu-btn" onclick="alert('Đang tải chế độ Đua...')">Racing</button>
            <button class="menu-btn" onclick="alert('Đang tải Thử thách...')">Challenge</button>
            <button class="menu-btn" onclick="alert('Bắt đầu lái xe tự do!')">Free Drive</button>
            <button class="menu-btn" onclick="alert('Mở cửa nhà xe Garage')">Garage</button>
        </div>
    </div>

    <script>
        // --- KHỞI TẠO THREE.JS SETUP ---
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        // Tạo sương mù màu tối để không gian có chiều sâu huyền ảo
        scene.fog = new THREE.FogExp2(0x050510, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 7);
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- ÁNH SÁNG NEON (LIGHTING) ---
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);

        // Ánh sáng hồng neon rọi từ phía trước bên trái
        const pinkLight = new THREE.PointLight(0xff007f, 2, 15);
        pinkLight.position.set(-4, 3, 2);
        scene.add(pinkLight);

        // Ánh sáng xanh ngọc rọi từ phía bên phải
        const cyanLight = new THREE.PointLight(0x00ffff, 2, 15);
        cyanLight.position.set(4, 2, -2);
        scene.add(cyanLight);

        // --- ĐỐI TƯỢNG ĐỒ HỌA 3D (OBJECTS) ---
        
        // 1. Tạo bục xoay trưng bày xe (Showroom Podium)
        const podiumGeo = new THREE.CylinderGeometry(2.5, 2.7, 0.3, 32);
        const podiumMat = new THREE.MeshStandardMaterial({ 
            color: 0x222233, 
            roughness: 0.2, 
            metalness: 0.8 
        });
        const podium = new THREE.Mesh(podiumGeo, podiumMat);
        podium.position.y = -0.15;
        scene.add(podium);

        // Vòng đèn LED viền bục xoay
        const ringGeo = new THREE.RingGeometry(2.5, 2.55, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
        const ledRing = new THREE.Mesh(ringGeo, ringMat);
        ledRing.rotation.x = Math.PI / 2;
        ledRing.position.y = 0.01;
        scene.add(ledRing);

        // 2. Mô hình xe đại diện (Thay bằng khối hộp để làm khung mẫu - Placeholder)
        // Trong game thật, bạn sẽ dùng GLTFLoader để tải file 3D `.gltf` hoặc `.glb` của xe Lamborghini vào đây
        const carGroup = new THREE.Group();
        
        // Thân xe xanh lá lục bảo phản quang dạ quang
        const bodyGeo = new THREE.BoxGeometry(1.2, 0.5, 2.6);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x39ff14, 
            roughness: 0.1, 
            metalness: 0.9 
        });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.4;
        carGroup.add(carBody);

        // Buồng lái xe nhựa đen trong suốt
        const cabinGeo = new THREE.BoxGeometry(0.9, 0.3, 1.2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
        const carCabin = new THREE.Mesh(cabinGeo, cabinMat);
        carCabin.position.set(0, 0.7, -0.1);
        carGroup.add(carCabin);

        scene.add(carGroup);

        // 3. Tạo môi trường xung quanh (Lưới Grid nền Cyberpunk)
        const gridHelper = new THREE.GridHelper(40, 40, 0xff007f, 0x221133);
        gridHelper.position.y = -0.3;
        scene.add(gridHelper);

        // Khung dây trang trí dạng lưới kiến trúc neon phía sau bục xoay
        const bgGeo = new THREE.IcosahedronGeometry(6, 1);
        const bgMat = new THREE.MeshBasicMaterial({ color: 0x331144, wireframe: true, transparent: true, opacity: 0.3 });
        const bgStructure = new THREE.Mesh(bgGeo, bgMat);
        bgStructure.position.set(0, 2, -8);
        scene.add(bgStructure);


        // --- VÒNG LẶP HÒA ÂM HÌNH ẢNH (ANIMATION LOOP) ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Làm xe tự động xoay tròn chậm rãi trên bục trưng bày
            carGroup.rotation.y = elapsedTime * 0.3;

            // Hiệu ứng đèn nhấp nháy mượt theo thời gian thời thượng
            pinkLight.intensity = 2 + Math.sin(elapsedTime * 2) * 0.5;
            cyanLight.intensity = 2 + Math.cos(elapsedTime * 2) * 0.5;

            // Xoay nhẹ khung lưới trang trí làm nền chuyển động sinh động
            bgStructure.rotation.y = elapsedTime * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        // --- XỬ LÝ KHI THAY ĐỔI KÍCH THƯỚC MÀN HÌNH ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
