<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    >

    <meta
        name="description"
        content="Astral Clash - Original 2D Stickman Energy Fighter"
    >

    <meta name="theme-color" content="#050812">

    <title>Astral Clash</title>

    <link rel="stylesheet" href="./src/styles/main.css">
</head>

<body>

<div id="app">

    <canvas id="gameCanvas"></canvas>

    <div id="ui">

        <section id="mainMenu" class="screen active">
            <div class="backgroundGlow"></div>

            <div class="logo">
                <span>ASTRAL</span>
                <strong>CLASH</strong>
            </div>

            <p class="tagline">
                STICKMAN ENERGY BATTLE
            </p>

            <div class="menuButtons">

                <button
                    id="playButton"
                    class="button primary"
                >
                    START BATTLE
                </button>

                <button
                    id="charactersButton"
                    class="button"
                >
                    CHARACTERS
                </button>

                <button
                    id="controlsButton"
                    class="button"
                >
                    CONTROLS
                </button>

            </div>

            <div class="version">
                ALPHA BUILD
            </div>
        </section>


        <section id="characterSelect" class="screen">

            <header class="screenHeader">
                <button
                    id="characterBack"
                    class="iconButton"
                >
                    ←
                </button>

                <h1>SELECT FIGHTER</h1>
            </header>

            <div
                id="characterGrid"
                class="characterGrid"
            ></div>

            <button
                id="characterFight"
                class="button primary large"
            >
                FIGHT
            </button>

        </section>


        <section id="controlsScreen" class="screen">

            <header class="screenHeader">

                <button
                    id="controlsBack"
                    class="iconButton"
                >
                    ←
                </button>

                <h1>CONTROLS</h1>

            </header>

            <div class="controlsPanel">

                <div>
                    <kbd>A</kbd>
                    <kbd>D</kbd>
                    <span>Move</span>
                </div>

                <div>
                    <kbd>W</kbd>
                    <kbd>SPACE</kbd>
                    <span>Jump</span>
                </div>

                <div>
                    <kbd>SHIFT</kbd>
                    <span>Dash</span>
                </div>

                <div>
                    <kbd>J</kbd>
                    <span>Basic attack</span>
                </div>

                <div>
                    <kbd>1</kbd>
                    <kbd>2</kbd>
                    <kbd>3</kbd>
                    <kbd>4</kbd>
                    <span>Skills</span>
                </div>

                <div>
                    <kbd>Q</kbd>
                    <kbd>E</kbd>
                    <kbd>R</kbd>
                    <span>Advanced skills</span>
                </div>

                <div>
                    <kbd>F</kbd>
                    <span>Ultimate</span>
                </div>

                <div>
                    <kbd>G</kbd>
                    <span>Transformation</span>
                </div>

                <div>
                    <kbd>P</kbd>
                    <span>Pause</span>
                </div>

            </div>

        </section>


        <section id="battleHUD" class="battleHUD">

            <div class="fighterStatus playerStatus">

                <div class="fighterName">
                    <span id="playerName">NOVA</span>
                </div>

                <div class="bar hp">
                    <div id="playerHP"></div>
                </div>

                <div class="bar ki">
                    <div id="playerKI"></div>
                </div>

                <div class="bar transform">
                    <div id="playerTransform"></div>
                </div>

            </div>


            <div id="comboCounter" class="comboCounter">
                <strong>0</strong>
                <span>HIT</span>
            </div>


            <div class="fighterStatus enemyStatus">

                <div class="fighterName">
                    <span id="enemyName">ZEN</span>
                </div>

                <div class="bar hp">
                    <div id="enemyHP"></div>
                </div>

            </div>


            <button
                id="pauseButton"
                class="pauseButton"
            >
                II
            </button>


            <div
                id="skillBar"
                class="skillBar"
            ></div>


            <button
                id="transformButton"
                class="transformButton"
            >
                TRANSFORM
                <small>G</small>
            </button>

        </section>


        <section id="pauseScreen" class="screen overlay">

            <h1>PAUSED</h1>

            <button
                id="resumeButton"
                class="button primary"
            >
                RESUME
            </button>

            <button
                id="quitButton"
                class="button"
            >
                QUIT
            </button>

        </section>


        <section id="resultScreen" class="screen overlay">

            <div id="resultTitle">
                VICTORY
            </div>

            <p id="resultSubtitle">
                THE ARENA BELONGS TO YOU
            </p>

            <button
                id="rematchButton"
                class="button primary"
            >
                REMATCH
            </button>

            <button
                id="resultMenuButton"
                class="button"
            >
                MAIN MENU
            </button>

        </section>

    </div>

</div>

<script
    type="module"
    src="./src/main.js"
></script>

</body>
</html>
