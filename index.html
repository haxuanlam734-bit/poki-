<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#050615">
  <title>Anime Stick Clash — V12 Concept Match</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Anime Stick Clash game"></canvas>
    <div id="boot">
      <div class="boot-title">ANIME STICK CLASH</div>
      <div class="boot-sub">V12 • CONCEPT MATCH</div>
      <div class="boot-bar"><i></i></div>
      <button id="startBtn">ENTER ARENA</button>
    </div>
    <div id="hud" class="hidden">
      <section class="player-card">
        <div class="avatar">K</div>
        <div>
          <b>KAGE</b><span> • VOID EDGE</span>
          <div class="meter hp"><i id="hpBar"></i></div>
          <div class="meter en"><i id="enBar"></i></div>
        </div>
      </section>
      <section class="wave-card"><small>WAVE</small><strong id="wave">1</strong><em id="waveState">INCOMING</em></section>
      <section class="combo"><strong id="combo">0</strong><span>HIT</span><small>COMBO</small></section>
      <button id="pauseBtn" class="pause">Ⅱ</button>
      <div class="skills">
        <button data-skill="Q"><kbd>Q</kbd><span>VOID CUT</span><i id="qCd"></i></button>
        <button data-skill="E"><kbd>E</kbd><span>PHANTOM DASH</span><i id="eCd"></i></button>
        <button data-skill="R"><kbd>R</kbd><span>DOMAIN</span><i id="rCd"></i></button>
      </div>
      <div id="message"></div>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
