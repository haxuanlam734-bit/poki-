<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Zombie City Survival</title>
    <!-- Tải trực tiếp Three.js từ CDN chuẩn xác, không lo lỗi thiếu file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Poki SDK -->
    <script src="https://game-sdk.poki.com/js/v2.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; user-select: none; font-family: Arial, sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10;
        }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 5, 0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20;
        }
        #game-over h1 { font-size: 40px; color: #ef4444; margin-bottom: 10px; }
        button {
            background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none;
            padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">MÁU: <span id="hp" style="color: #22c55e;">100</span> | TIÊU DIỆT: <span id="score" style="color: #38bdf8;">0</span></div>

    <div id="game-over">
        <h1>BẠN ĐÃ GỤC NGÃ</h1>
        <button onclick="location.reload()">CHƠI LẠI</button>
    </div>

    <script>
        try {
            PokiSDK.init().then(() => { PokiSDK.gameLoadingFinished(); });
        } catch(e) {}

        // 1. Khởi tạo Scene 3D
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng cho không gian 3D
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        // 2. Tạo Map 3D từ ảnh map.jpg
        const textureLoader = new THREE.TextureLoader();
        const mapMaterial = new THREE.MeshBasicMaterial({ 
            map: textureLoader.load('map.jpg', undefined, undefined, () => { console.log('Lỗi tải map.jpg'); }) 
        });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), mapMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 3. Tạo Nhân vật 3D từ player.png
        const playerMaterial = new THREE.SpriteMaterial({ 
            map: textureLoader.load('player.png', undefined, undefined, () => { console.log('Lỗi tải player.png'); }) 
        });
        const player = new THREE.Sprite(playerMaterial);
        player.scale.set(4, 4, 1);
        player.position.y = 2;
        scene.add(player);

        // 4. Tạo Zombie 3D từ zombie.png
        let zombies = [];
        const zombieMaterial = new THREE.SpriteMaterial({ 
            map: textureLoader.load('zombie.png', undefined, undefined, () => { console.log('Lỗi tải zombie.png'); }) 
        });

        for (let i = 0; i < 5; i++) {
            let zombie = new THREE.Sprite(zombieMaterial);
            zombie.scale.set(4, 4, 1);
            zombie.position.set((Math.random() - 0.5) * 40, 2, (Math.random() - 0.5) * 40);
            scene.add(zombie);
            zombies.push(zombie);
        }

        // Điều khiển bàn phím
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        let score = 0;
        let hp = 100;

        // Vòng lặp game 3D
        function animate() {
            requestAnimationFrame(animate);

            // Di chuyển nhân vật
            if (keys['KeyW'] || keys['ArrowUp']) player.position.z -= 0.3;
            if (keys['KeyS'] || keys['ArrowDown']) player.position.z += 0.3;
            if (keys['KeyA'] || keys['ArrowLeft']) player.position.x -= 0.3;
            if (keys['KeyD'] || keys['ArrowRight']) player.position.x += 0.3;

            // Camera đuổi theo nhân vật
            camera.position.set(player.position.x, player.position.y + 10, player.position.z + 12);
            camera.lookAt(player.position);

            // Zombie đuổi theo nhân vật
            zombies.forEach(z => {
                z.position.x += (player.position.x - z.position.x) * 0.015;
                z.position.z += (player.position.z - z.position.z) * 0.015;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
