<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Zombie City Survival</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://game-sdk.poki.com/js/v2.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; user-select: none; font-family: Arial, sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10;
        }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 5, 0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20;
        }
        #game-over h1 { font-size: 40px; color: #ef4444; margin-bottom: 10px; }
        button {
            background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none;
            padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">MÁU: <span id="hp" style="color: #22c55e;">100</span> | TIÊU DIỆT: <span id="score" style="color: #38bdf8;">0</span></div>

    <div id="game-over">
        <h1>BẠN ĐÃ GỤC NGÃ</h1>
        <button onclick="location.reload()">CHƠI LẠI</button>
    </div>

    <script>
        try {
            PokiSDK.init().then(() => { PokiSDK.gameLoadingFinished(); });
        } catch(e) {}

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));

        const textureLoader = new THREE.TextureLoader();

        // 1. Dùng ĐÚNG ảnh map.jpg làm mặt phẳng 3D
        const mapTexture = textureLoader.load('map.jpg');
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshBasicMaterial({ map: mapTexture })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 2. Dùng ĐÚNG ảnh player.png (nhân vật cầm súng)
        const playerTexture = textureLoader.load('player.png');
        const player = new THREE.Sprite(new THREE.SpriteMaterial({ map: playerTexture }));
        player.scale.set(5, 5, 1);
        player.position.y = 2.5;
        scene.add(player);

        // 3. Dùng ĐÚNG ảnh zombie.png cho lũ zombie
        const zombieTexture = textureLoader.load('zombie.png');
        let zombies = [];
        for (let i = 0; i < 8; i++) {
            let zombie = new THREE.Sprite(new THREE.SpriteMaterial({ map: zombieTexture }));
            zombie.scale.set(4, 4, 1);
            zombie.position.set((Math.random() - 0.5) * 50, 2, (Math.random() - 0.5) * 50);
            scene.add(zombie);
            zombies.push(zombie);
        }

        // Đạn và hệ thống ngắm bắn
        let bullets = [];
        let score = 0;
        let hp = 100;
        let keys = {};
        let mouse = { x: 0, y: 0 };

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Bắn súng khi click chuột
        window.addEventListener('mousedown', () => {
            let bullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xfacc15 })
            );
            bullet.position.copy(player.position);
            
            // Hướng đạn bay theo góc nhìn chuột
            let angle = Math.atan2(mouse.x, mouse.y);
            bullet.userData = { 
                vx: Math.sin(angle) * 0.8, 
                vz: -Math.cos(angle) * 0.8 
            };
            scene.add(bullet);
            bullets.push(bullet);
        });

        function animate() {
            requestAnimationFrame(animate);

            // Di chuyển nhân vật
            if (keys['KeyW'] || keys['ArrowUp']) player.position.z -= 0.4;
            if (keys['KeyS'] || keys['ArrowDown']) player.position.z += 0.4;
            if (keys['KeyA'] || keys['ArrowLeft']) player.position.x -= 0.4;
            if (keys['KeyD'] || keys['ArrowRight']) player.position.x += 0.4;

            // Camera đuổi theo và xoay theo vị trí nhân vật
            camera.position.set(player.position.x, player.position.y + 12, player.position.z + 14);
            camera.lookAt(player.position);

            // Cập nhật đạn bay
            bullets.forEach((b, index) => {
                b.position.x += b.userData.vx;
                b.position.z += b.userData.vz;

                // Kiểm tra đạn trúng zombie
                zombies.forEach((z, zIndex) => {
                    if (b.position.distanceTo(z.position) < 2) {
                        scene.remove(z);
                        zombies.splice(zIndex, 1);
                        scene.remove(b);
                        bullets.splice(index, 1);
                        score++;
                        document.getElementById("score").innerText = score;
                    }
                });
            });

            // Zombie đuổi theo nhân vật
            zombies.forEach(z => {
                z.position.x += (player.position.x - z.position.x) * 0.012;
                z.position.z += (player.position.z - z.position.z) * 0.012;

                if (player.position.distanceTo(z.position) < 1.5) {
                    hp -= 0.5;
                    document.getElementById("hp").innerText = Math.max(0, Math.floor(hp));
                    if (hp <= 0) {
                        document.getElementById("game-over").style.display = "flex";
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
