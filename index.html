<!DOCTYPE html>
<html>
<head>
    <title>3D Zombie Survival</title>
    <script src="js/three.min.js"></script>
    <script src="https://game-sdk.poki.com/js/v2.js"></script>
    <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
<script>
    // 1. Thiết lập Scene 3D
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. Tạo Map 3D từ ảnh map.jpg
    const mapTexture = new THREE.TextureLoader().load('map.jpg');
    const geometry = new THREE.PlaneGeometry(100, 100);
    const material = new THREE.MeshBasicMaterial({map: mapTexture});
    const ground = new THREE.Mesh(geometry, material);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 3. Tạo Nhân vật 3D từ player.png (Sprite 3D)
    const pTexture = new THREE.TextureLoader().load('player.png');
    const pMat = new THREE.SpriteMaterial({map: pTexture});
    const player = new THREE.Sprite(pMat);
    player.scale.set(5, 5, 1);
    scene.add(player);

    camera.position.z = 20;
    camera.position.y = 10;
    camera.rotation.x = -0.5;

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // Quảng cáo Poki
    PokiSDK.init().then(() => {
        PokiSDK.gameLoadingFinished();
    });
</script>
</body>
</html>
