<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stickman Fighter</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
        canvas { background-color: #222; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        #ui-layer { position: absolute; top: 10px; display: flex; gap: 20px; font-weight: bold; }
    </style>
    <!-- Mốc tích hợp Poki SDK (Thay bằng script chính thức khi đăng ký) -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div>Player 1 (Goku-ish) HP: <span id="hp1">100</span></div>
        <div>Phím: A/D (Đi), W (Nhảy), J (Đánh), K (Skill 1), L (Skill 2), T (Biến hình)</div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <script src="game.js"></script>
</body>
</html>
