<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Zombie City Survival</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://game-sdk.poki.com/js/v2.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0f19; user-select: none; font-family: Arial, sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10;
        }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 5, 0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20;
        }
        #game-over h1 { font-size: 40px; color: #ef4444; margin-bottom: 10px; }
        button {
            background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none;
            padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">MÁU: <span id="hp" style="color: #22c55e;">100</span> | TIÊU DIỆT: <span id="score" style="color: #38bdf8;">0</span></div>

    <div id="game-over">
        <h1>BẠN ĐÃ GỤC NGÃ</h1>
        <button onclick="location.reload()">CHƠI LẠI</button>
    </div>

    <script>
        try {
            PokiSDK.init().then(() => { PokiSDK.gameLoadingFinished(); });
        } catch(e) {}

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng chiếu sáng toàn cảnh
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // 1. Tạo Map đường phố 3D kèm lưới
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(150, 150),
            new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
        
        const gridHelper = new THREE.GridHelper(150, 30, 0x374151, 0x1f2937);
        gridHelper.position.y = 0.05;
        scene.add(gridHelper);

        // 2. Tạo Nhân vật & Súng 3D rõ nét (Màu xanh dương + Súng vàng nổi bật)
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Thân nhân vật
        const bodyMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 2.5, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x0284c7 })
        );
        bodyMesh.position.y = 1.25;
        playerGroup.add(bodyMesh);

        // Khẩu súng trên tay nhân vật
        const gunMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 0.4, 1.2),
            new THREE.MeshStandardMaterial({ color: 0xf59e0b })
        );
        gunMesh.position.set(0.7, 1.3, 0.6);
        playerGroup.add(gunMesh);

        // 3. Tạo đàn Zombie 3D (Màu xanh lá đậm dễ nhận diện)
        let zombies = [];
        const zombieGeo = new THREE.BoxGeometry(1.2, 2.5, 0.8);
        const zombieMat = new THREE.MeshStandardMaterial({ color: 0x16a34a });

        for (let i = 0; i < 10; i++) {
            let zombie = new THREE.Mesh(zombieGeo, zombieMat);
            zombie.position.set((Math.random() - 0.5) * 60, 1.25, (Math.random() - 0.5) * 60);
            scene.add(zombie);
            zombies.push(zombie);
        }

        let bullets = [];
        let score = 0;
        let hp = 100;
        let keys = {};
        let mouse = { x: 0, y: 0 };

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);
        
        // Theo dõi tọa độ chuột để xoay nhân vật và camera theo ý muốn
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Click chuột để bắn đạn về hướng chuột
        window.addEventListener('mousedown', () => {
            let bullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xfef08a })
            );
            bullet.position.copy(playerGroup.position);
            bullet.position.y = 1.5;
            
            let angle = playerGroup.rotation.y;
            bullet.userData = { 
                vx: Math.sin(angle) * 1.2, 
                vz: Math.cos(angle) * 1.2 
            };
            scene.add(bullet);
            bullets.push(bullet);
        });

        function animate() {
            requestAnimationFrame(animate);

            // Di chuyển nhân vật bằng W, A, S, D
            let speed = 0.35;
            if (keys['KeyW'] || keys['ArrowUp']) {
                playerGroup.position.x -= Math.sin(playerGroup.rotation.y) * speed;
                playerGroup.position.z -= Math.cos(playerGroup.rotation.y) * speed;
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                playerGroup.position.x += Math.sin(playerGroup.rotation.y) * speed;
                playerGroup.position.z += Math.cos(playerGroup.rotation.y) * speed;
            }
            if (keys['KeyA'] || keys['ArrowLeft']) playerGroup.rotation.y += 0.04;
            if (keys['KeyD'] || keys['ArrowRight']) playerGroup.rotation.y -= 0.04;

            // Camera góc nhìn 3D đuổi theo sau lưng nhân vật mượt mà
            let camDistX = playerGroup.position.x + Math.sin(playerGroup.rotation.y) * 12;
            let camDistZ = playerGroup.position.z + Math.cos(playerGroup.rotation.y) * 12;
            camera.position.set(camDistX, playerGroup.position.y + 8, camDistZ);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            // Cập nhật đạn bay & va chạm với zombie
            bullets.forEach((b, index) => {
                b.position.x += b.userData.vx;
                b.position.z += b.userData.vz;

                zombies.forEach((z, zIndex) => {
                    if (b.position.distanceTo(z.position) < 1.8) {
                        scene.remove(z);
                        zombies.splice(zIndex, 1);
                        scene.remove(b);
                        bullets.splice(index, 1);
                        score++;
                        document.getElementById("score").innerText = score;
                    }
                });
            });

            // Zombie tự động đuổi theo nhân vật
            zombies.forEach(z => {
                z.position.x += (playerGroup.position.x - z.position.x) * 0.015;
                z.position.z += (playerGroup.position.z - z.position.z) * 0.015;

                if (playerGroup.position.distanceTo(z.position) < 1.5) {
                    hp -= 0.6;
                    document.getElementById("hp").innerText = Math.max(0, Math.floor(hp));
                    if (hp <= 0) {
                        document.getElementById("game-over").style.display = "flex";
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
