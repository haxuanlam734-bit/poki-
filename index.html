<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/three.min.js"></script>
    <script src="https://game-sdk.poki.com/js/v2.js"></script>
</head>
<body>
    <script src="js/player.js"></script>
    <script src="js/zombie.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const player = createPlayer(scene);
        let zombies = [];
        for(let i=0; i<10; i++) zombies.push(spawnZombie(scene));

        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);
            handleMovement(player, keys);
            moveZombies(zombies, player);
            camera.position.set(player.position.x, 15, player.position.z + 15);
            camera.lookAt(player.position);
            renderer.render(scene, camera);
        }
        animate();

        // Tích hợp quảng cáo Poki khi người chơi thua (Ví dụ)
        function gameOver() {
            PokiSDK.commercialBreak().then(() => {
                location.reload(); // Reset game
            });
        }
    </script>
</body>
</html>
